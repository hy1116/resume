spring.application.name=resume
server.port=9090
spring.profiles.active=secret

resume.access-password=${RESUME_ACCESS_PASSWORD:changeme}
resume.access-token=${RESUME_ACCESS_TOKEN:}

# DB 접속정보는 실행 폴더의 .env 에서 읽는다 (없으면 무시, git 제외). 환경변수로 넣어도 된다.
spring.config.import=optional:file:.env[.properties]
spring.mongodb.uri=${SPRING_MONGODB_URI:}
# 포트폴리오 프로젝트 실행 상태 확인용 URL (2xx 응답이면 실행 중으로 표시)
resume.status.stocksense-url=${RESUME_STATUS_STOCKSENSE_URL:https://stocksense.hypepia.com/health}
resume.status.apiverse-url=${RESUME_STATUS_APIVERSE_URL:https://apiverse.hypepia.com/api/health}
# 퍼즐 게임 (hy1116.github.io) — 쉼표로 여러 URL 지정, 모두 2xx여야 실행 중
resume.status.puzzle-urls=${RESUME_STATUS_PUZZLE_URLS:https://hy1116.github.io/slither-link/,https://hy1116.github.io/minesweeper/}

# 정적 리소스 캐싱 — /css, /images 를 1년 캐시.
# 템플릿에서 @{/...(v=${assetVersion})} 로 참조해 배포(재시작)마다 URL이 바뀌므로 이전 캐시가 쓰이지 않는다.
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# 응답 압축 (html, css, js, json, svg) — 1KB 이상일 때만
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
server.compression.min-response-size=1KB
